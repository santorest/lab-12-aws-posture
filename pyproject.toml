[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "postureck"
version = "1.0.0"
description = "Compare Prowler audits of an emulated AWS account before/after a Terraform remediation and gate on the result (portfolio lab 12)"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["boto3>=1.43", "PyYAML>=6.0"]

[project.scripts]
postureck = "postureck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.coverage.run]
source = ["postureck"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["terraform", "spike"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["moto", "moto.*"]
ignore_missing_imports = true
