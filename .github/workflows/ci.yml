name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"     # weekly
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.16.5

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false -input=false && terraform -chdir=terraform validate
      - run: tflint --init && tflint --recursive --chdir=terraform --config="$PWD/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: shellcheck scripts/*.sh
      - run: yamllint -s .

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - run: pytest --cov=postureck --cov-report=term-missing --cov-fail-under=90
      - run: terraform -chdir=terraform init -backend=false -input=false && terraform -chdir=terraform test

  iac-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install checkov==3.3.23
      - name: Checkov on both postures (for comparison; it does not gate the planted flaws)
        run: |
          {
            echo "## Checkov (static IaC scan, for comparison)"
            echo
            echo "| Posture | Passed | Failed |"
            echo "|---|---|---|"
            for posture in vulnerable remediated; do
              checkov -d terraform --var-file "terraform/envs/$posture.tfvars" --download-external-modules false \
                --skip-download --compact --quiet -o json > "checkov-$posture.json" < /dev/null || true
              python3 -c "
          import json, sys
          data = json.load(open(sys.argv[1]))
          data = data if isinstance(data, list) else [data]
          s = [d.get('summary', {}) for d in data]
          print(f\"| {sys.argv[2]} | {sum(x.get('passed', 0) for x in s)} | {sum(x.get('failed', 0) for x in s)} |\")
          " "checkov-$posture.json" "$posture"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkov
          path: checkov-*.json

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - name: LocalStack -> vulnerable -> audit -> remediated -> audit -> destroy -> report -> gate
        run: bash scripts/run-audit.sh
      - name: Summary
        if: always()
        run: if [ -f out/summary.md ]; then cat out/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-results
          path: out/
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history, pinned by digest)
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          git /repo --redact --verbose
